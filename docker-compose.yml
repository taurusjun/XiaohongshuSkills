# xhs 容器 —— base（可移植，Linux 云与 Mac 共用）
# 宿主差异只出现在 docker-compose.override.<host>.yml 与 .env
services:
  xhs:
    build:
      context: .
      dockerfile: Dockerfile
    image: xhs:dev
    container_name: xhs
    env_file:
      - ops/xhs.env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${XHS_PROJECT_DIR}:/home/user/PG/XiaohongshuSkills
      - xhs-profiles:/data/chrome-profiles
      - xhs-backup:/backup
    ports:
      - "0.0.0.0:${XHS_UI_PORT:-15000}:5000"      # admin UI（对外开放；宿主端口必须避开生产 5000）
      - "127.0.0.1:${XHS_MCP_PORT:-15001}:5001"   # MCP (http)
      - "127.0.0.1:${XHS_CDP_PORT:-19222}:9222"   # CDP（宿主端口必须避开生产 9222）
    shm_size: "1g"
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  xhs-profiles:
  xhs-backup:
