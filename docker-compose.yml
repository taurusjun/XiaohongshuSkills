# xhs 容器 —— base（可移植，Linux 云与 Mac 共用）
# 宿主差异只出现在 docker-compose.override.<host>.yml 与 .env
services:
  xhs:
    build:
      context: .
      dockerfile: Dockerfile
    image: xhs:dev
    container_name: xhs
    env_file:
      - ops/xhs.env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ${XHS_PROJECT_DIR}:/home/user/PG/XiaohongshuSkills
      - xhs-profiles:/data/chrome-profiles
      - xhs-backup:/backup
    ports:
      - "127.0.0.1:${XHS_UI_PORT:-5000}:5000"    # admin UI
      - "127.0.0.1:${XHS_MCP_PORT:-5001}:5001"   # MCP (http)
      - "127.0.0.1:${XHS_CDP_PORT:-9222}:9222"   # CDP（只绑 127.0.0.1）
    shm_size: "1g"
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  xhs-profiles:
  xhs-backup:
