[supervisord]
nodaemon=true
user=root
logfile=/home/user/PG/XiaohongshuSkills/logs/supervisord.log
logfile_maxbytes=10MB
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
autorestart=true
priority=10
user=user
stdout_logfile=/home/user/PG/XiaohongshuSkills/logs/xvfb.log
redirect_stderr=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -localhost -quiet
autorestart=true
priority=15
user=user
stdout_logfile=/home/user/PG/XiaohongshuSkills/logs/x11vnc.log
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true
priority=16
user=user
stdout_logfile=/home/user/PG/XiaohongshuSkills/logs/novnc.log
redirect_stderr=true

[program:cdp-keeper]
command=/home/user/PG/XiaohongshuSkills/.venv/bin/python /opt/ops/cdp_keeper.py
autorestart=true
priority=20
user=user
startsecs=5
stdout_logfile=/home/user/PG/XiaohongshuSkills/logs/cdp-keeper.log
redirect_stderr=true

[program:webapp]
command=/home/user/PG/XiaohongshuSkills/.venv/bin/python web/app.py
directory=/home/user/PG/XiaohongshuSkills
autorestart=true
priority=30
user=user
stdout_logfile=/home/user/PG/XiaohongshuSkills/logs/webapp.log
redirect_stderr=true

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
priority=40
user=root
stdout_logfile=/home/user/PG/XiaohongshuSkills/logs/cron.log
redirect_stderr=true
