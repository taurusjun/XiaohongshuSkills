[supervisord]
nodaemon=true
user=root
logfile=/home/user/PG/XiaohongshuSkills/logs/supervisord.log
logfile_maxbytes=10MB
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
autorestart=true
priority=10
user=user
stdout_logfile=/home/user/PG/XiaohongshuSkills/logs/xvfb.log
redirect_stderr=true

[program:cdp-keeper]
command=/home/user/PG/XiaohongshuSkills/.venv/bin/python /opt/ops/cdp_keeper.py
autorestart=true
priority=20
user=user
startsecs=5
stdout_logfile=/home/user/PG/XiaohongshuSkills/logs/cdp-keeper.log
redirect_stderr=true

[program:webapp]
command=/home/user/PG/XiaohongshuSkills/.venv/bin/python web/app.py
directory=/home/user/PG/XiaohongshuSkills
autorestart=true
priority=30
user=user
stdout_logfile=/home/user/PG/XiaohongshuSkills/logs/webapp.log
redirect_stderr=true

[program:mcp]
command=/home/user/PG/XiaohongshuSkills/.venv/bin/fastmcp run mcp_servers/xhs_operations_server.py --transport http --host 0.0.0.0 --port 5001
directory=/home/user/PG/XiaohongshuSkills
autorestart=true
priority=30
user=user
stdout_logfile=/home/user/PG/XiaohongshuSkills/logs/mcp_sse.log
redirect_stderr=true

[program:cron]
command=/usr/sbin/cron -f
autorestart=true
priority=40
user=root
stdout_logfile=/home/user/PG/XiaohongshuSkills/logs/cron.log
redirect_stderr=true
