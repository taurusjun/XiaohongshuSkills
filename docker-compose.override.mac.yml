# Mac (colima) 专属 override —— 用命名卷"遮挡"macOS 的 .venv/data/tmp/logs，
# 隔离可变状态，绝不覆盖生产 venv、绝不写生产 DB。
# 用法：docker compose -f docker-compose.yml -f docker-compose.override.mac.yml up -d
services:
  xhs:
    platform: linux/amd64
    ports:
      - "0.0.0.0:16080:6080"       # noVNC（浏览器远程控制容器 Chrome，可点验证；对外开放）
    environment:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple   # 境内加速 venv 引导
      NO_PROXY: "127.0.0.1,localhost,api.deepseek.com,news.yahoo.co.jp,yimg.jp,creator.xiaohongshu.com,www.xiaohongshu.com,open.feishu.cn"
      no_proxy: "127.0.0.1,localhost,api.deepseek.com,news.yahoo.co.jp,yimg.jp,creator.xiaohongshu.com,www.xiaohongshu.com,open.feishu.cn"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"   # 容器只有 IPv4 路由；否则 pip 走 IPv6 会 Network unreachable
    build:
      args:
        APT_MIRROR: mirrors.cloud.tencent.com   # 境内构建加速；Linux 云可留空用官方源
    volumes:
      - ${XHS_VENV_SRC}:/home/user/PG/XiaohongshuSkills/.venv
      - ${XHS_DATA_SRC}:/home/user/PG/XiaohongshuSkills/data
      - ${XHS_LOGS_SRC}:/home/user/PG/XiaohongshuSkills/logs
      - ${XHS_TMP_SRC}:/home/user/PG/XiaohongshuSkills/tmp
      - ${XHS_GALLERY_SRC}:/home/user/.cache/xhs_images
      - ${XHS_EXPORTS_SRC}:/home/user/.cache/xhs_exports

volumes:
  xhs-venv:
  xhs-data:
  xhs-logs:
  xhs-tmp:
  xhs-gallery:
  xhs-exports:
