# Mac (colima) 专属 override —— 用命名卷"遮挡"macOS 的 .venv/data/tmp/logs，
# 隔离可变状态，绝不覆盖生产 venv、绝不写生产 DB。
# 用法：docker compose -f docker-compose.yml -f docker-compose.override.mac.yml up -d
services:
  xhs:
    platform: linux/amd64
    environment:
      PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple   # 境内加速 venv 引导
      # 容器内代理指向 VM 网关(宿主 Mac 的 127.0.0.1:20809)；主链路/境内服务走直连
      HTTP_PROXY: http://192.168.5.2:20809
      HTTPS_PROXY: http://192.168.5.2:20809
      ALL_PROXY: socks5://192.168.5.2:20809
      NO_PROXY: "127.0.0.1,localhost,api.deepseek.com,news.yahoo.co.jp,creator.xiaohongshu.com,www.xiaohongshu.com,open.feishu.cn"
      no_proxy: "127.0.0.1,localhost,api.deepseek.com,news.yahoo.co.jp,creator.xiaohongshu.com,www.xiaohongshu.com,open.feishu.cn"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"   # 容器只有 IPv4 路由；否则 pip 走 IPv6 会 Network unreachable
    build:
      args:
        APT_MIRROR: mirrors.cloud.tencent.com   # 境内构建加速；Linux 云可留空用官方源
    volumes:
      - xhs-venv:/home/user/PG/XiaohongshuSkills/.venv
      - xhs-data:/home/user/PG/XiaohongshuSkills/data
      - xhs-logs:/home/user/PG/XiaohongshuSkills/logs
      - xhs-tmp:/home/user/PG/XiaohongshuSkills/tmp

volumes:
  xhs-venv:
  xhs-data:
  xhs-logs:
  xhs-tmp:
